name: TAZA SMS payment security
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/sms/route.ts'
      - 'tests/security.test.ts'
      - '.github/workflows/sms-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify SMS payment and playback regression tests
        run: npm test
