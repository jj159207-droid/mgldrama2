name: Client master installer verification
on:
  push:
    branches: [client-master-installer]
    paths:
      - 'START-HERE.cmd'
      - 'installer/**'
      - 'tests/ui/client-master-installer.test.cjs'
      - '.github/workflows/client-master-installer.yml'
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'package*.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'eslint.config.mjs'
      - '.env.example'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('installer/TAZA-SETUP.ps1',[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("line {0}: {1}" -f $_.Extent.StartLineNumber,$_.Message) }
            exit 1
          }
      - name: UI and installer tests
        run: npm run test:ui
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff safety
        run: git diff --check
      - name: Build sanitized flash-drive package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .package TAZA-SITE-MASTER.zip
          ROOT=.package/TAZA-SITE-MASTER
          mkdir -p "$ROOT/installer" "$ROOT/scripts"

          cp START-HERE.cmd "$ROOT/"
          cp installer/TAZA-SETUP.ps1 installer/README-MN.txt installer/macro-template.mdr.gz.b64 "$ROOT/installer/"
          cp -a app lib public supabase "$ROOT/"
          cp scripts/provision-ffmpeg.mjs scripts/preflight.mjs scripts/migrate-posters.ts "$ROOT/scripts/"
          cp .env.example .gitignore package.json package-lock.json next.config.js postcss.config.mjs tsconfig.json eslint.config.mjs "$ROOT/"

          node <<'NODE'
          const fs=require('node:fs');
          const root='.package/TAZA-SITE-MASTER';

          const pagePath=`${root}/app/page.tsx`;
          let page=fs.readFileSync(pagePath,'utf8');
          const originalPage=page;
          page=page.replace(/const DEFAULT_BANK_ACCOUNT = \{[\s\S]*?\};/,`const DEFAULT_BANK_ACCOUNT = {\n  bank: "Банк",\n  number: "0000000000",\n  name: "Данс эзэмшигч",\n};`);
          page=page.replace(/<input value=\{bankAccount\}[^\n]*/,(line)=>line.replace(/placeholder="[^"]*"/,'placeholder="0000000000"'));
          if(page===originalPage) throw new Error('Page client defaults were not sanitized');
          fs.writeFileSync(pagePath,page);

          const settingsPath=`${root}/app/api/settings/route.ts`;
          let settings=fs.readFileSync(settingsPath,'utf8');
          settings=settings
            .replace(/process\.env\.BANK_NAME\|\|'[^']*'/,"process.env.BANK_NAME||'Банк'")
            .replace(/process\.env\.BANK_ACCOUNT\|\|'[^']*'/,"process.env.BANK_ACCOUNT||'0000000000'")
            .replace(/process\.env\.BANK_ACCOUNT_NAME\|\|'[^']*'/,"process.env.BANK_ACCOUNT_NAME||'Данс эзэмшигч'");
          fs.writeFileSync(settingsPath,settings);

          const checkPage=fs.readFileSync(pagePath,'utf8');
          const checkSettings=fs.readFileSync(settingsPath,'utf8');
          const accountLine=checkPage.split(/\r?\n/).find(line=>line.includes('value={bankAccount}'));
          if(!/bank: "Банк"[\s\S]*number: "0000000000"[\s\S]*name: "Данс эзэмшигч"/.test(checkPage)) throw new Error('Generic page bank defaults missing');
          if(!accountLine||!accountLine.includes('placeholder="0000000000"')) throw new Error('Generic account placeholder missing');
          if(!/BANK_NAME\|\|'Банк'/.test(checkSettings)||!/BANK_ACCOUNT\|\|'0000000000'/.test(checkSettings)||!/BANK_ACCOUNT_NAME\|\|'Данс эзэмшигч'/.test(checkSettings)) throw new Error('Generic settings fallbacks missing');
          NODE

          test ! -e "$ROOT/installer/TAZA-SETUP-V2.ps1"
          test ! -e "$ROOT/installer/TAZA-SETUP-FINAL.ps1"
          test ! -e "$ROOT/scripts/verify-production-trailers.mjs"
          test ! -e "$ROOT/scripts/install-payment-login-settings.mjs"
          test ! -e "$ROOT/scripts/install-payment-login-settings-safe.mjs"
          if grep -RIn --binary-files=without-match 'kino-uzeh\.vercel\.app' "$ROOT"; then
            echo 'Production endpoint leaked into client package.' >&2
            exit 1
          fi

          (cd .package && zip -qr ../TAZA-SITE-MASTER.zip TAZA-SITE-MASTER)
          unzip -t TAZA-SITE-MASTER.zip
      - name: Upload flash-drive package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TAZA-SITE-MASTER
          path: TAZA-SITE-MASTER.zip
          if-no-files-found: error
          retention-days: 30
