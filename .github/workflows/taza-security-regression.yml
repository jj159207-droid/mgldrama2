name: TAZA production security regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/server.ts'
      - 'app/api/sms/route.ts'
      - 'next.config.js'
      - 'tests/security.test.ts'
      - 'tests/security-headers.test.ts'
      - 'lib/bank-details.ts'
      - 'app/api/settings/route.ts'
      - 'app/api/readiness/route.ts'
      - 'lib/macrodroid-template.json'
      - 'app/api/admin/macrodroid/route.ts'
      - 'app/api/admin/sms-diagnostics/route.ts'
      - 'app/api/admin/video-diagnostics/route.ts'
      - 'app/components/AdminVideoDiagnostics.tsx'
      - 'app/api/playback/route.ts'
      - 'app/api/direct-download/route.ts'
      - 'lib/film-details.ts'
      - 'tests/film-details.test.ts'
      - 'app/components/AdminSmsDiagnostics.tsx'
      - 'app/page.tsx'
      - 'app/components/OfflineDownloadButton.tsx'
      - 'lib/offline-video.ts'
      - 'lib/direct-video-file.ts'
      - 'tests/direct-video-file.test.ts'
      - 'public/offline.html'
      - 'public/sw.js'
      - 'app/offline.css'
      - 'app/layout.tsx'
      - 'tests/offline-video.test.ts'
      - 'app/components/AgeGate.tsx'
      - 'tests/ui/age-gate.test.cjs'
      - 'tests/bank-details.test.ts'
      - '.github/workflows/taza-security-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install audited lockfile
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Authentication and payment regression tests
        run: npm test
      - name: User interface regression tests
        run: npm run test:ui
      - name: Production build
        run: npm run build
