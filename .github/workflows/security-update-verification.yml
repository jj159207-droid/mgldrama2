name: Security patch Next.js 16.4.5 and verify
on:
  push:
    branches: [security/next-16-4-5-mobile-20261105]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Resolve dependencies from registry and refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reinstall exact resolved lockfile
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Payment and security regression tests
        run: npm test
      - name: Frontend UI tests
        run: npm run test:ui
      - name: Production build
        run: npm run build
      - name: Publish verified lockfile back to review branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(lockfile): resolve patched Next.js and sharp dependencies"
            git push origin HEAD:security/next-16-4-5-mobile-20261105
          fi
