name: Verify trailer poster fallback
on:
  push:
    branches: [poster-trailer-fallback]
    paths:
      - 'scripts/patch-poster-trailer-fallback.mjs'
      - '.github/workflows/poster-trailer-fallback.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: poster-trailer-fallback
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply trailer poster fallback
        run: node scripts/patch-poster-trailer-fallback.mjs
      - name: Install dependencies
        run: npm ci
      # Retry after the previous hosted runner was terminated externally.
      - name: UI tests
        run: npm run test:ui
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff safety
        run: git diff --check
      - name: Commit verified feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/components/FilmLanding.tsx tests/ui/movie-details.test.cjs
          git commit -m 'Use trailer when poster image is missing'
          git push origin HEAD:poster-trailer-fallback