name: Verify guest device access
on:
  push:
    branches: [feature-guest-device-access]
    paths:
      - 'scripts/patch-guest-device-access.mjs'
      - 'scripts/patch-guest-device-tests.mjs'
      - '.github/workflows/feature-guest-device-access.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature-guest-device-access
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply guest device flow
        run: |
          node scripts/patch-guest-device-access.mjs
          node scripts/patch-guest-device-tests.mjs
      - name: Install dependencies
        run: npm ci
      - name: UI tests
        run: npm run test:ui
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff safety
        run: git diff --check
      - name: Commit verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/server.ts app/api/auth/route.ts app/api/device/route.ts app/api/chat/route.ts app/api/db/route.ts app/components/SupportChat.tsx app/page.tsx supabase/setup.sql supabase/migrations/20260917071000_guest_device_access.sql tests/ui/movie-details.test.cjs tests/security.test.ts
          git commit -m 'Allow device-based guest purchases and support access'
          git push origin HEAD:feature-guest-device-access
