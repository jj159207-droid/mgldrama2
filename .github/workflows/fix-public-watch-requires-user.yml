name: Verify public watch user login gate
on:
  push:
    branches: [fix-public-watch-requires-user]
    paths:
      - 'scripts/patch-public-watch-login-gate.mjs'
      - '.github/workflows/fix-public-watch-requires-user.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix-public-watch-requires-user
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply login-gate patch
        run: node scripts/patch-public-watch-login-gate.mjs
      - name: Install dependencies
        run: npm ci
      - name: UI tests
        run: npm run test:ui
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff safety
        run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx tests/ui/movie-details.test.cjs
          git commit -m 'Require user login before public full playback'
          git push origin HEAD:fix-public-watch-requires-user
