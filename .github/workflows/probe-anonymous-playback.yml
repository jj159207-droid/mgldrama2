name: Probe anonymous production playback
on:
  push:
    branches: [fix-login-required-playback]
    paths:
      - 'scripts/probe-anonymous-playback.mjs'
      - '.github/workflows/probe-anonymous-playback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Probe production as a cookie-less guest
        run: node scripts/probe-anonymous-playback.mjs
