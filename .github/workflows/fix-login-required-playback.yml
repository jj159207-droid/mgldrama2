name: Verify login-required playback fix
on:
  push:
    branches: [fix-login-required-playback]
    paths:
      - 'app/api/playback/route.ts'
      - 'scripts/patch-login-required-playback-test.mjs'
      - '.github/workflows/fix-login-required-playback.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix-login-required-playback
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Update regression test
        run: node scripts/patch-login-required-playback-test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: UI tests
        run: npm run test:ui
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diff safety
        run: git diff --check
      - name: Commit verified regression test
        run: |
          if git diff --quiet -- tests/security.test.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/security.test.ts
          git commit -m 'Test login requirement for full playback'
          git push origin HEAD:fix-login-required-playback
